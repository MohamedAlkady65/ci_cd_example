name: deploy

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+' # v1.2.3 -> production
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+' # v1.2.3-rc.1 -> staging

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ github.ref_name }} to ${{ contains(github.ref_name, '-rc.') && 'staging' || 'production' }}
    runs-on:
      - self-hosted
      - linux
      - ${{ vars[contains(github.ref_name, '-rc.') && 'STAGING_RUNNER' || 'PRODUCTION_RUNNER'] }}
    environment: ${{ contains(github.ref_name, '-rc.') && 'staging' || 'production' }}
    concurrency:
      group: deploy-${{ contains(github.ref_name, '-rc.') && 'staging' || 'production' }}
      cancel-in-progress: false
    env:
      APP_IMAGE: ${{ vars.APP_NAME }}:${{ github.ref_name }}
      CONTAINER_NAME: ${{ vars.APP_NAME }}-${{ contains(github.ref_name, '-rc.') && 'staging' || 'production' }}
      APP_PORT: ${{ vars.APP_PORT }}
    steps:
      - uses: actions/checkout@v5

      - name: Build production image
        run: docker build --target production -t "$APP_IMAGE" .

      - name: Replace running container
        run: |
          docker rm -f "$CONTAINER_NAME" 2>/dev/null || true
          docker run -d --name "$CONTAINER_NAME" --restart unless-stopped \
            -p "$APP_PORT:3000" "$APP_IMAGE"

      - name: Container logs
        if: always()
        run: docker logs "$CONTAINER_NAME" || true

      - name: Remove dangling images
        if: always()
        run: docker image prune -f
