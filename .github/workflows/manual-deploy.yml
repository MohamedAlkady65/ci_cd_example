name: manual-deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy to
        type: environment
        required: true
      ref:
        description: Tag, branch or commit SHA to deploy (e.g. v1.2.3, main)
        type: string
        required: true

run-name: Deploy ${{ inputs.ref }} to ${{ inputs.environment }}

permissions:
  contents: read

jobs:
  validate:
    name: Validate ref ${{ inputs.ref }}
    runs-on:
      - self-hosted
      - linux
      - ${{ vars[inputs.environment == 'development' && 'DEVELOPMENT_RUNNER' || inputs.environment == 'staging' && 'STAGING_RUNNER' || 'PRODUCTION_RUNNER'] }}
    outputs:
      sha: ${{ steps.ref.outputs.sha }}
      image_tag: ${{ steps.ref.outputs.image_tag }}
    steps:
      - name: Validate ref
        id: ref
        env:
          REF: ${{ inputs.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! printf '%s' "$REF" | grep -Eq '^[A-Za-z0-9._/-]+$'; then
            echo "::error::Invalid ref '$REF': only letters, digits, '.', '_', '/' and '-' are allowed"
            exit 1
          fi
          # Resolves branches, tags and (short) SHAs; returns the full commit SHA
          if ! sha=$(curl -sf \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github.sha" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$REF"); then
            echo "::error::Ref '$REF' not found in $GITHUB_REPOSITORY (no matching branch, tag or commit)"
            exit 1
          fi
          # Docker tags allow only [A-Za-z0-9_.-], max 128 chars (branches like feature/x need sanitizing)
          tag=$(printf '%s' "$REF" | sed 's/[^A-Za-z0-9_.-]/-/g' | cut -c1-128)
          echo "Deploying $REF ($sha) as image tag $tag"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "image_tag=$tag" >> "$GITHUB_OUTPUT"

  deploy:
    needs: validate
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: ${{ inputs.environment }}
      ref: ${{ needs.validate.outputs.sha }}
      image_tag: ${{ needs.validate.outputs.image_tag }}
