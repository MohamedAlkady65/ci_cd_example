name: deploy-dev

on:
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy dev (${{ github.sha }}) to development
    runs-on: [self-hosted, linux, '${{ vars.DEVELOPMENT_RUNNER }}']
    environment: development
    concurrency:
      group: deploy-development
      cancel-in-progress: false
    env:
      ENV_FILE: ${{ vars.ENV_FILE }}
      IMAGE_TAG: dev-${{ github.sha }}
    steps:
      - uses: actions/checkout@v5

      - name: Check env file exists
        run: |
          if [ -z "$ENV_FILE" ]; then
            echo "::error::Set the ENV_FILE variable on the 'development' environment"
            exit 1
          fi
          if [ ! -f "$ENV_FILE" ]; then
            echo "::error::Env file $ENV_FILE not found on this machine"
            exit 1
          fi

      - name: Build production image
        run: docker compose -f compose.yaml --env-file "$ENV_FILE" build

      - name: Start container
        run: docker compose -f compose.yaml --env-file "$ENV_FILE" up -d --no-build --wait

      - name: Container logs
        if: always()
        run: docker compose -f compose.yaml --env-file "$ENV_FILE" logs || true

      - name: Remove dangling images
        if: always()
        run: docker image prune -a -f
